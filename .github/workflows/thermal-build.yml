name: Build Thermal Controls Test APK

on:
  workflow_dispatch:
  push:
    branches: [ a333-thermal-controls ]
    paths:
      - 'app/**'
      - 'fpsvalidator/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/thermal-build.yml'

permissions:
  contents: write

concurrency:
  group: kb1001-thermal-controls
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set thermal test version
        shell: bash
        run: |
          APP_CODE=$((200000 + GITHUB_RUN_NUMBER))
          APP_NAME="0.5-thermal.${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION_CODE=$APP_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_ASSET=KB1001-Performance-Manager-${APP_NAME}.apk" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate bundled root backend
        shell: bash
        run: |
          for f in app/src/main/assets/backend/*.sh app/src/main/assets/backend/kb1001ctl; do
            sh -n "$f"
          done
          grep -q 'STATE_DIR="/data/local/kb1001perf/state"' app/src/main/assets/backend/common.sh

      - name: Build APK
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kb1001-release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/kb1001-release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_SECRET"
            export ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS_SECRET"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD_SECRET"
            export STABLE_SIGNING=1
            gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$APP_ASSET"
          else
            export STABLE_SIGNING=0
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$APP_ASSET"
          fi

      - name: Verify APK
        shell: bash
        run: |
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APP_ASSET"
          sha256sum "$APP_ASSET" | tee thermal-apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: thermal-controls-apk
          path: |
            ${{ env.APP_ASSET }}
            thermal-apk.sha256

      - name: Publish rolling thermal test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="thermal-controls-latest"
          NOTES="Rolling test build from a333-thermal-controls. This release is separate from main/dev-latest."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "KB1001 Performance Manager - Thermal Controls Test" --notes "$NOTES"
          else
            gh release create "$TAG" --title "KB1001 Performance Manager - Thermal Controls Test" --notes "$NOTES" --prerelease
          fi

          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "$TAG" "$asset" -y || true
          done

          gh release upload "$TAG" "$APP_ASSET" thermal-apk.sha256 --clobber

      - name: Summary
        shell: bash
        run: |
          {
            echo "# Thermal Controls Test Build"
            echo
            echo "APK: \`${APP_ASSET}\`"
            echo
            echo "Release channel: \`thermal-controls-latest\`"
            echo
            echo "Main \`dev-latest\` release is untouched."
          } >> "$GITHUB_STEP_SUMMARY"
