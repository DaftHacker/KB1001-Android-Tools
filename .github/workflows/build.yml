name: Build KB1001 Performance Manager

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'module/**'
      - 'scripts/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate module shell scripts
        run: |
          for f in module/*.sh module/kb1001ctl; do
            sh -n "$f"
          done

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package Magisk module
        run: bash scripts/package-module.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KB1001-Performance-Manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: KB1001-GPU-Profiles-v1.2-AutoBoost
          path: out/KB1001-GPU-Profiles-v1.2-AutoBoost.zip
