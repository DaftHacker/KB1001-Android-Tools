name: Build KB1001 Performance Manager

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'fpsvalidator/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:

concurrency:
  group: kb1001-dev-main-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set development version
        shell: bash
        run: |
          APP_CODE=$((100000 + GITHUB_RUN_NUMBER))
          APP_NAME="0.5-dev.${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION_CODE=$APP_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_ASSET=KB1001-Performance-Manager-${APP_NAME}.apk" >> "$GITHUB_ENV"
          echo "VALIDATOR_VERSION_NAME=0.1-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VALIDATOR_ASSET=KB1001-FPS-Validator-0.1-dev.${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Validate bundled root backend
        shell: bash
        run: |
          for f in app/src/main/assets/backend/*.sh app/src/main/assets/backend/kb1001ctl; do
            sh -n "$f"
          done

          grep -q 'STATE_DIR="/data/local/kb1001perf/state"' app/src/main/assets/backend/common.sh

          if grep -R '/data/adb/modules/kb1001_gpu_profiles' app/src/main/assets/backend; then
            echo "Bundled runtime scripts still reference the legacy Magisk module path."
            exit 1
          fi

          if grep -R '/data/adb/modules/kb1001_gpu_profiles' app/src/main/java \
              | grep -v 'BackendManager.java'; then
            echo "Android runtime code still references the legacy module outside migration code."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kb1001-release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/kb1001-release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_SECRET"
            export ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS_SECRET"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD_SECRET"
            export STABLE_SIGNING=1

            echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=1" >> "$GITHUB_ENV"

            gradle :app:assembleRelease :fpsvalidator:assembleRelease --stacktrace
          else
            export STABLE_SIGNING=0
            echo "STABLE_SIGNING=0" >> "$GITHUB_ENV"
            gradle :app:assembleDebug :fpsvalidator:assembleDebug --stacktrace
          fi

      - name: Name APK
        shell: bash
        run: |
          if [ "${STABLE_SIGNING:-0}" = "1" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APP_ASSET"
            cp fpsvalidator/build/outputs/apk/release/fpsvalidator-release.apk "$VALIDATOR_ASSET"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$APP_ASSET"
            cp fpsvalidator/build/outputs/apk/debug/fpsvalidator-debug.apk "$VALIDATOR_ASSET"
          fi

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APP_ASSET" | tee apk-signing.txt
          "$APKSIGNER" verify --verbose --print-certs "$VALIDATOR_ASSET" | tee validator-signing.txt
          CERT_SHA256="$(grep -m1 'Signer #1 certificate SHA-256 digest:' apk-signing.txt | sed 's/.*digest: //')"
          test -n "$CERT_SHA256"
          echo "APK_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Generate update manifest
        shell: bash
        run: |
          APP_SHA="$(sha256sum "$APP_ASSET" | awk '{print $1}')"

          cat > update.json <<EOF
          {
            "changelog": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/dev-latest",
            "app_version_code": ${APP_VERSION_CODE},
            "app_version_name": "${APP_VERSION_NAME}",
            "commit": "${GITHUB_SHA}",
            "app_asset": "${APP_ASSET}",
            "app_sha256": "${APP_SHA}",
            "backend_bundled": true,
            "module_required": false,
            "stable_app_signing": ${STABLE_SIGNING:-0}
          }
          EOF
      - name: Publish direct development download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_NOTES="Rolling main build. The privileged backend is bundled inside the APK and installs its own root boot service hook. No Magisk module is built or required."

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --title "KB1001 Performance Manager - Development" \
              --notes "$RELEASE_NOTES"
          else
            gh release create dev-latest \
              --title "KB1001 Performance Manager - Development" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          fi

          gh release view dev-latest --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset dev-latest "$asset" -y || true
          done

          gh release upload dev-latest \
            "$APP_ASSET" \
            "$VALIDATOR_ASSET" \
            update.json \
            --clobber

      - name: Write direct download links to Actions summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          {
            echo "# KB1001 Development Build"
            echo
            echo "### Direct download"
            echo
            echo "- [📱 Download APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/${APP_ASSET})"
            echo "- [🧪 Download FPS Validator](https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/${VALIDATOR_ASSET})"
            echo "- [📄 Update manifest](https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/update.json)"
            echo
            echo "App + bundled root backend: **${APP_VERSION_NAME}** (code ${APP_VERSION_CODE})"
            echo
            echo "No Magisk module installation is required."
            echo
            echo "APK certificate SHA-256: `${APK_CERT_SHA256}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-verification
          path: |
            ${{ env.APP_ASSET }}
            ${{ env.VALIDATOR_ASSET }}
            update.json
