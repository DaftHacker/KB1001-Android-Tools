name: Build KB1001 Performance Manager

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'module/**'
      - 'scripts/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate module scripts
        run: |
          for f in module/*.sh module/kb1001ctl; do sh -n "$f"; done

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KB1001-Performance-Manager-v0.2-alpha.apk

      - name: Package Magisk module
        run: bash scripts/package-module.sh

      - name: Verify direct flashable module
        run: |
          unzip -p out/KB1001-Performance-Manager-v1.3-HUD-Logger.zip module.prop | grep -q '^id=kb1001_gpu_profiles$'
          unzip -t out/KB1001-Performance-Manager-v1.3-HUD-Logger.zip >/dev/null

      - name: Publish direct development downloads
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --title "KB1001 Performance Manager - Development" --notes "Rolling main build. APK installs directly; Magisk ZIP flashes directly."
          else
            gh release create dev-latest --title "KB1001 Performance Manager - Development" --notes "Rolling main build. APK installs directly; Magisk ZIP flashes directly." --prerelease
          fi
          gh release upload dev-latest KB1001-Performance-Manager-v0.2-alpha.apk out/KB1001-Performance-Manager-v1.3-HUD-Logger.zip --clobber

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: build-verification
          path: |
            KB1001-Performance-Manager-v0.2-alpha.apk
            out/KB1001-Performance-Manager-v1.3-HUD-Logger.zip
